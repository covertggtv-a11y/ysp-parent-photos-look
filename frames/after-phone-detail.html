<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>AFTER · Photo detail</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060B; --surface:#1F1C26; --surface-2:#2B2736; --border:#5F5677;
  --brand:#F249C4; --brand-dark:#8C1E70; --accent:#4FC0F5;
  --fg:#F7F5FA; --muted:#9A93AD; --dim:#958DAE; --on-brand:#12000C;
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
  --warn:#fcd34d; --warn-soft:rgba(252,211,77,.12);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12);
  --r-card:14px; --r-ctl:10px; --r-pill:999px;
  --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:Anton,"Arial Narrow",Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--fg);background:#05040a;
  -webkit-font-smoothing:antialiased;letter-spacing:-.022em}
button,input{font:inherit}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.ribbon{position:fixed;top:10px;left:10px;z-index:50;font-size:10px;font-weight:700;
  letter-spacing:.14em;padding:4px 9px;border-radius:999px;border:1px solid;
  background:rgba(31,28,38,.94);backdrop-filter:blur(6px)}
.ribbon.before{color:var(--warn);border-color:rgba(252,211,77,.35)}
.ribbon.after{color:var(--ok);border-color:rgba(52,211,153,.35)}
.device{width:390px;height:844px;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;
  display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex:0 0 auto}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(145deg,#F249C4,#4FC0F5);
  display:grid;place-items:center;color:var(--on-brand);font-size:9px;font-weight:800;line-height:1.05;text-align:center}
.brand{font-size:15px;font-weight:700}
.menu{margin-left:auto;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--r-ctl);
  display:grid;place-items:center;background:var(--surface-2);color:var(--fg);font-size:16px}
.hero{background:var(--surface);color:var(--fg);padding:16px 16px 0;flex:0 0 auto;border-bottom:1px solid var(--border)}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-bottom:4px}
.hero h1{font-family:var(--disp);font-size:28px;line-height:.95;letter-spacing:.01em}
.hero .meta{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.tabs{display:flex;gap:18px;margin-top:14px}
.tabs span{font-size:14px;font-weight:600;color:var(--dim);padding-bottom:10px;border-bottom:2px solid transparent}
.tabs .on{color:var(--brand);border-bottom-color:var(--brand)}
.main{flex:1;overflow:hidden;padding:18px 16px 20px;background:var(--bg)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-h h2{font-family:var(--disp);font-size:18px;letter-spacing:.04em}
.section-h .count{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(52,211,153,.3)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(252,211,77,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 18px;border-radius:var(--r-ctl);border:0;
  background:var(--brand);color:var(--on-brand);font-weight:700;font-size:14.5px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--border)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid rgba(248,113,113,.4)}
.btn.block{width:100%}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 20px 24px;gap:14px;min-height:420px}
.empty .illus{width:88px;height:88px;border-radius:22px;background:var(--surface);
  border:1px solid var(--border);display:grid;place-items:center;color:var(--accent);font-size:34px}
.empty p{font-size:14.5px;color:var(--muted);max-width:28ch;line-height:1.45}
.game-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.game-h:first-child{margin-top:0}
.game-h .left{font-size:13px;font-weight:650}
.game-h .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);border:1px solid var(--border)}
.tile .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(247,245,250,.9);
  font-weight:700;font-size:18px;letter-spacing:.02em}
.tile .heart{position:absolute;left:6px;bottom:6px;background:rgba(7,6,11,.65);color:var(--fg);
  font-size:10px;font-weight:600;padding:2px 6px;border-radius:999px;border:1px solid rgba(95,86,119,.5)}
.tile.sel{outline:2px solid var(--brand);outline-offset:-2px}
.tile .check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}

.device{background:#05040a}
.bar{height:52px;display:flex;align-items:center;padding:0 14px;gap:12px;flex:0 0 auto}
.bar .back{font-size:22px;line-height:1;width:36px}
.bar .meta{flex:1;font-size:13px;font-weight:600}
.bar .meta small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
.photo{flex:1;margin:0 12px;border-radius:14px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#2B2736 0%,#1F1C26 50%,#F249C4 160%);
  display:grid;place-items:center;border:1px solid var(--border)}
.photo .sil{width:140px;height:180px;border-radius:70px 70px 40px 40px;
  background:linear-gradient(180deg,rgba(247,245,250,.15),rgba(7,6,11,.45));
  position:relative}
.photo .sil::before{content:"";position:absolute;top:-36px;left:50%;transform:translateX(-50%);
  width:64px;height:64px;border-radius:50%;background:rgba(247,245,250,.16)}
.photo .cap{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted)}
.actions{padding:16px 16px 28px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.note{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.4}
</style></head><body>

<span class="ribbon after">AFTER</span>
<div class="device">
  <div class="bar">
    <div class="back">←</div>
    <div class="meta">vs South Florida Select<small>Sat, Aug 15 · uploaded by Coach Lee</small></div>
    <span class="chip ok">Team only</span>
  </div>
  <div class="photo">
    <div class="sil"></div>
    <div class="cap">Jersey from behind · no face shown</div>
  </div>
  <div class="actions">
    <div class="row">
      <button class="btn" style="flex:1">♥ Heart · 7</button>
      <button class="btn sec" style="flex:1">Save to My kid's album</button>
    </div>
    <button class="btn warn block">Hide my kid + tell coach</button>
    <p class="note">Hide is instant for you. Coach is told so they can remove it for the team. No public share link.</p>
  </div>
</div>

</body></html>
